services:
  postgres_db:
    image: postgres:18-alpine
    container_name: nymit_postgres_local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword123
      POSTGRES_DB: nymit_dev
    ports:
      - "5432:5432"
    volumes:
      - nymit_postgres_data_v18:/var/lib/postgresql
    restart: always

volumes:
  nymit_postgres_data_v18: